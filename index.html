<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recepção L9</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1F23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recepção L9">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="vendor/jspdf.umd.min.js"></script>
<style>
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}

/* Layout: app de campo offline, mobile-first. Barra com marca → lista local → formulário em seções → laudo em PDF → WhatsApp e OneDrive. */
:root{
  --bg:#F3F4F5; --surface:#FFFFFF; --sunken:#F8F8F9; --ink:#1E2124; --muted:#5F666D; --line:#E1E3E6;
  --brand:#F58634; --brand-ink:#B4581A; --brand-soft:#FEF0E5; --on-brand:#FFFFFF;
  --ok:#1D7F48; --ok-soft:#E3F3EA; --warn:#9A6400; --warn-soft:#FBF1DC; --bad:#BC3426; --bad-soft:#FBE7E4;
  --shadow:0 1px 2px rgba(20,22,25,.06),0 2px 8px rgba(20,22,25,.04);
  --f-display:"Jost","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141619; --surface:#1C1F23; --sunken:#181A1E; --ink:#ECEDEF; --muted:#9BA2AA; --line:#2C3036;
  --brand:#F7924A; --brand-ink:#FFB57D; --brand-soft:#2E2117; --on-brand:#1A0F06;
  --ok:#5BC98A; --ok-soft:#14291D; --warn:#E3B04F; --warn-soft:#2D2412; --bad:#F07B6E; --bad-soft:#331917;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;height:58px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{height:22px;width:auto;display:block}
.top-tag{font:500 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.top-sp{flex:1}
.icon-btn{position:relative;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.icon-btn .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--brand);color:var(--on-brand);font:600 11px/20px var(--f-mono);text-align:center}
@media (max-width:600px){.top-tag{display:none}.logo{height:18px}#btn-new .btn-lbl{display:none}#btn-new{width:40px;padding:0}}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.lg{height:50px;font-size:16px;padding:0 22px}
.btn[disabled]{opacity:.5;cursor:default}

h1{font:500 26px/1.15 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:500 18px/1.2 var(--f-display);margin:0;letter-spacing:.005em}
.eyebrow{font:500 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);font-size:14px;margin-bottom:16px}
.notice p{margin:0;flex:1 1 240px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

/* LISTA */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;text-decoration:none;color:inherit}
.kpi b{font:500 22px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.go{background:var(--brand-soft)}
.kpi.go b{color:var(--brand-ink)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;height:40px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1fr) 92px 92px 72px 130px;gap:12px;align-items:center;
  padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--sunken)}
.row.th{cursor:default;font:500 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--sunken)}
.row .r{text-align:right}
.cell-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-main span{font-size:13px;color:var(--muted)}
.date b{display:block;font:500 14px var(--f-mono)}
.date span{font:12px var(--f-mono);color:var(--muted)}
@media (max-width:820px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main chip" "meta meta";row-gap:6px}
  .row.th{display:none}.row .date{display:none}
  .row .cell-main{grid-area:main}.row .chipc{grid-area:chip}
  .row .m-meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
  .row .d-only{display:none}
}
@media (min-width:821px){.m-meta{display:none}}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.draft{background:var(--sunken);color:var(--muted);border:1px dashed var(--line)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:500 17px var(--f-display);margin-bottom:6px}
.empty .btn{margin-top:14px}

/* FORM */
.form-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.form-head .sp{flex:1}
.saved{font-size:12px;color:var(--muted)}
.steps{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;scrollbar-width:none}
.steps a{flex:none;font-size:13px;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;scroll-margin-top:calc(74px + env(safe-area-inset-top,0px))}
.sec-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sec-h .n{width:26px;height:26px;border-radius:7px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:600 13px var(--f-mono);flex:none}
.sec-b{padding:18px;display:grid;gap:16px}
@media (max-width:480px){.sec-b{padding:14px}.sec-h{padding:12px 14px}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.in{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunken);width:100%;font-size:16px}
.in:focus{background:var(--surface);border-color:var(--brand);outline:none}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
.unit{position:relative}
.unit .in{padding-right:44px}
.unit i{position:absolute;right:12px;top:0;height:44px;display:flex;align-items:center;font-style:normal;font-size:13px;color:var(--muted)}
.calc{height:44px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);font:500 15px var(--f-mono)}
.defects{display:grid;gap:12px}
.defect{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 130px 82px auto;align-items:end;background:var(--sunken)}
.defect .pct{height:44px;display:flex;align-items:center;justify-content:flex-end;font:500 15px var(--f-mono)}
.defect .photos{grid-column:1/-1}
@media (max-width:620px){.defect{grid-template-columns:minmax(0,1fr) auto}.defect .f-nome{grid-column:1;grid-row:1}.defect .rm{grid-column:2;grid-row:1}.defect .f-kg{grid-column:1;grid-row:2}.defect .pct{grid-column:2;grid-row:2;min-width:64px}.defect .photos{grid-row:3}}
.total-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:8px;background:var(--brand);color:var(--on-brand);font-weight:600;flex-wrap:wrap}
.total-bar .num{font-size:16px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--line);flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.ph button svg{width:14px;height:14px}
.ph.loading::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.ph.loading::before{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;z-index:1}
@keyframes sp{to{transform:rotate(360deg)}}
.add-ph{width:84px;height:84px;border-radius:8px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);font-size:11px;background:var(--surface);flex:none}
.add-ph:hover{border-color:var(--brand);color:var(--brand-ink)}
.add-ph svg{width:22px;height:22px}
.add-ph input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px 26px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt label{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;background:var(--surface);user-select:none}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.opt label:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.opt.good label:has(input[value="Conforme"]:checked),.opt.good label:has(input[value="Não"]:checked){border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.good label:has(input[value="Não conforme"]:checked),.opt.good label:has(input[value="Sim"]:checked){border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.good label:has(input[value="Conforme com ressalva"]:checked){border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.parecer{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.add-row{display:flex;gap:8px}
.add-row .in{flex:1;min-width:0}
.sig{border:1px solid var(--line);border-radius:8px;background:#fff;position:relative;height:160px;touch-action:none}
.sig canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.sig .line{position:absolute;left:24px;right:24px;bottom:34px;border-bottom:1px solid #C9CCD0;pointer-events:none}
.sig .hint{position:absolute;left:24px;bottom:12px;font-size:12px;color:#8A9096;pointer-events:none}
.sig-tools{display:flex;justify-content:flex-end;gap:8px}
.bar{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in .sp{flex:1}
.bar-in .msg{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.bar-in .msg{display:none}.bar-in .sp{display:none}.bar-in .btn{flex:1;padding:0 10px}}

/* LAUDO */
.rep-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.rep-actions .sp{flex:1}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:22px 26px;border-bottom:3px solid var(--brand);flex-wrap:wrap}
.sheet-top .code{text-align:right;font:500 12px/1.5 var(--f-mono);color:var(--muted)}
.sheet-top .code b{color:var(--ink);font-size:13px}
.sheet-title{padding:22px 26px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sheet-title h1{font-size:24px;letter-spacing:.02em}
.id-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:14px 26px 6px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.id-grid div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.id-grid div:nth-child(4n){border-right:0}
.id-grid div:nth-last-child(-n+4){border-bottom:0}
.id-grid small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.id-grid b{font-weight:600;overflow-wrap:anywhere}
.rs{padding:18px 26px}
.rs-h{display:flex;align-items:center;justify-content:space-between;gap:2px 12px;flex-wrap:wrap;background:var(--brand);color:var(--on-brand);padding:8px 12px;border-radius:6px;font:500 15px var(--f-display);letter-spacing:.02em;margin-bottom:12px}
.rs-h .num{font-size:14px;white-space:nowrap}
@media (max-width:620px){
  .id-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .id-grid div:nth-child(4n){border-right:1px solid var(--line)}.id-grid div:nth-child(2n){border-right:0}
  .id-grid div:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.id-grid div:nth-last-child(-n+2){border-bottom:0}
  .sheet-top,.sheet-title,.rs{padding-left:16px;padding-right:16px}.id-grid{margin-left:16px;margin-right:16px}.sheet-top .code{text-align:left}
}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 4px;border-bottom:1px dotted var(--line)}
.tbl td.v{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.bar-c{width:30%}
.mini{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.mini i{display:block;height:100%;background:var(--brand)}
.rep-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.rep-ph figure{margin:0}
.rep-ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block;background:var(--line)}
.rep-ph figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.scale{display:flex;gap:10px}
.scale div{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;min-width:0}
.scale small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.scale b{font:500 22px var(--f-mono)}
.scale .mid{border-color:var(--brand);background:var(--brand-soft)}
.scale .mid b{color:var(--brand-ink)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;padding:4px 10px;border-radius:6px;background:var(--sunken);border:1px solid var(--line)}
.sign{padding:26px;display:flex;flex-direction:column;align-items:center;gap:4px;border-top:1px solid var(--line)}
.sign .sig-img{height:64px;display:flex;align-items:flex-end;justify-content:center}
.sign .sig-img img{max-height:64px;background:#fff;border-radius:4px}
.sign .ln{width:260px;max-width:100%;border-top:1px solid var(--ink);margin-top:2px}
.sign b{font-size:14px}
.sign span{font-size:13px;color:var(--muted)}
.prose{font-size:14px;max-width:70ch;white-space:pre-wrap;margin:0}
.confirm{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:500;flex-wrap:wrap}

/* ENVIO */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.send-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
@media (max-width:620px){.send-hero{grid-template-columns:1fr}.send-hero .btn{width:100%}}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.flow b{color:var(--ink);font-weight:600}
.flow svg{width:14px;height:14px;color:var(--brand)}
.q{display:grid;gap:0;margin-top:4px}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.qi:first-child{border-top:0}
.qi b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi small{color:var(--muted);font-size:13px;grid-column:1}
.qi .st{grid-row:1/3;grid-column:2;font-size:13px;font-weight:600;white-space:nowrap}
.st.wait{color:var(--muted)}.st.run{color:var(--brand-ink)}.st.done{color:var(--ok)}.st.err{color:var(--bad)}
.prog{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden;grid-column:1/-1}
.prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.meter{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--brand)}
.cfg{display:grid;gap:14px;max-width:520px}
.qi.sel{grid-template-columns:auto minmax(0,1fr);column-gap:14px}
.qi.sel input{width:22px;height:22px;accent-color:var(--brand);grid-row:1/4;margin:0}
.qi.sel b{grid-column:2}.qi.sel small{grid-column:2;grid-row:2}.qi.sel .st{grid-column:2;grid-row:3;font-size:12px}
.qi label{display:contents;cursor:pointer}
.after{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--ok-soft);color:var(--ok);margin-bottom:16px;font-size:14px}
.after p{margin:0;flex:1 1 260px;color:var(--ink)}
.after b{color:var(--ok)}
.shared{color:var(--ok);font-weight:600}
.envio{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.passo{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.passo:first-child{border-top:0}
.passo .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-mono);background:var(--sunken);border:1px solid var(--line);color:var(--muted)}
.passo.ok .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.passo b{display:block;font-weight:600}
.passo small{display:block;color:var(--muted);font-size:13px}
.passo.ok small{color:var(--ok)}
.passo .btn{min-width:112px}
.passo.fim{background:var(--sunken)}
.passo.fim .n{background:transparent;border-style:dashed}
@media (max-width:420px){.passo{grid-template-columns:30px minmax(0,1fr)}.passo .btn{grid-column:2;justify-self:start;margin-top:6px}}
.howto{font-size:14px;margin:0;padding-left:20px;display:grid;gap:6px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.upd{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:19;background:var(--brand);color:var(--on-brand)}
.upd-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:14px;font-weight:500}
.upd-in span{flex:1 1 200px}
.upd .btn{background:var(--on-brand);color:var(--brand);border-color:var(--on-brand);height:34px;font-size:13px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding-block:8px calc(24px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a href="#lista" aria-label="Início"><img class="logo" id="logo" alt="Latitude 9" src="icons/logo.png"></a>
  <span class="top-tag">Recepção · Qualidade</span>
  <span class="top-sp"></span>
  <a class="icon-btn" href="#config" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></a>
  <a class="icon-btn" href="#compartilhar" aria-label="Enviar inspeções"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 001 1h12a1 1 0 001-1v-6"/></svg><span class="badge" id="badge" hidden></span></a>
  <button class="btn pri" id="btn-new" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="btn-lbl">Nova inspeção</span></button>
</div></header>

<div class="upd" id="upd" hidden role="status"><div class="upd-in"><span>Nova versão do app disponível.</span><button class="btn" type="button" id="upd-btn">Atualizar agora</button></div></div>
<main class="wrap" id="view"><div class="empty"><b>Abrindo…</b></div></main>
<div id="bar-slot"></div>
<p class="foot" id="foot"></p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => {
  if (v === '' || v == null) return null; let s = String(v).trim().replace(/\s/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^[1-9]\d{0,2}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return isFinite(n) ? n : null;
};
const fmt = (n, d = 2) => n == null || !isFinite(n) ? '—' : n.toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});
const fmtI = n => n == null ? '—' : n.toLocaleString('pt-BR', {maximumFractionDigits: 2});
const pad = n => String(n).padStart(2, '0');
const pctTxt = v => v == null || !isFinite(v) ? '—' : fmt(v) + '%';
const mb = b => b == null ? '—' : (b / 1048576).toLocaleString('pt-BR', {maximumFractionDigits: b < 10485760 ? 1 : 0}) + ' MB';
const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 001 1h12a1 1 0 001-1v-6"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};
const DEFEITOS_PADRAO = ['Podridão ácida', 'Mosca da fruta', 'Rachadura', 'Manchas'];
const OCORRENCIAS = ['Baga podre','Baga rachada','Bagas e cachos murchos','Cicatrizes','Cochonilha','Baga amassada','Cachos com coloração clara','Cachos compactados','Problemas de limpeza','Baga murcha','Degrana excessiva'];
const UNIDADES = ['Contentor','Caixa','Bin','Palete'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const VERSAO_APP = '1.5', VERSAO_DATA = '29/10/2026';
$('#foot').textContent = '© ' + new Date().getFullYear() + ' Ângelo Eduardo. Todos os direitos reservados. · Versão ' + VERSAO_APP;
let toastT;
function toast(msg, ms = 2800) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

/* ---------- Banco local (IndexedDB) ---------- */
let idb;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('recepcao-l9', 1);
    r.onupgradeneeded = () => { const d = r.result;
      d.createObjectStore('inspecoes', {keyPath: 'id'}); d.createObjectStore('fotos');
      d.createObjectStore('enviadas', {keyPath: 'id'}); d.createObjectStore('config'); };
    r.onsuccess = () => res(idb = r.result); r.onerror = () => rej(r.error);
  });
}
function req(store, mode, fn) {
  return new Promise((res, rej) => { const tx = idb.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st);
    tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Sem espaço no aparelho')); });
}
const dbAll = s => req(s, 'readonly', st => st.getAll());
const dbGet = (s, k) => req(s, 'readonly', st => st.get(k));
const dbPut = (s, v, k) => req(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k));
const dbDel = (s, k) => req(s, 'readwrite', st => st.delete(k));
const dbKeys = s => req(s, 'readonly', st => st.getAllKeys());

let inspecoes = [], enviadas = [], cfg = {};
async function carregar() {
  inspecoes = await dbAll('inspecoes'); enviadas = await dbAll('enviadas');
  inspecoes.sort((a, b) => String(b.dataHora || '').localeCompare(String(a.dataHora || '')));
  enviadas.sort((a, b) => String(b.enviadoEm).localeCompare(String(a.enviadoEm)));
  cfg = (await dbGet('config', 'cfg')) || {};
  const n = inspecoes.filter(pendente).length; const b = $('#badge'); b.hidden = !n; b.textContent = n;
}
async function salvarCfg() { await dbPut('config', cfg, 'cfg'); }

/* ---------- Fotos ---------- */
const urls = new Map();
async function urlFoto(id) {
  if (!id) return ''; if (urls.has(id)) return urls.get(id);
  const b = await dbGet('fotos', id); if (!b) return ''; const u = URL.createObjectURL(b); urls.set(id, u); return u;
}
function fotosDe(r) {
  const ids = []; const add = l => (l || []).forEach(f => f?.id && ids.push(f.id));
  (r.defeitos || []).forEach(d => add(d.fotos)); add(r.diametro?.fotos); add(r.brix?.fotos); add(r.degrana?.fotos); add(r.corpoEstranho?.fotos); add(r.fotosGerais);
  if (r.assinatura?.id) ids.push(r.assinatura.id); return ids;
}
const preUrls = r => Promise.all(fotosDe(r).map(urlFoto));
const src = f => urls.get(f?.id) || '';
async function limparOrfas(extra = []) {
  const usadas = new Set(extra); inspecoes.forEach(r => fotosDe(r).forEach(i => usadas.add(i)));
  for (const k of await dbKeys('fotos')) if (!usadas.has(k)) { await dbDel('fotos', k); if (urls.has(k)) { URL.revokeObjectURL(urls.get(k)); urls.delete(k); } }
}
function compress(file, max = 1600, q = .8) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('falha ao processar')), 'image/jpeg', q); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('imagem inválida')); }; img.src = u;
  });
}
const novoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
async function guardarFoto(blob) { const id = novoId('f'); await dbPut('fotos', blob, id); urls.set(id, URL.createObjectURL(blob)); return {id}; }

/* ---------- Modelo ---------- */
function novoCodigo(d) { return 'IR-' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()); }
function localISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function nova() {
  const d = new Date();
  return { id: novoId('i'), codigo: novoCodigo(d), status: 'rascunho', dataHora: localISO(d), produtor: '', variedade: '', parcela: '',
    qtdeRecebida: null, unidade: 'Contentor', pesoMedio: null, unAnalisadas: null,
    defeitos: DEFEITOS_PADRAO.map(n => ({nome: n, kg: null, fotos: []})),
    diametro: {min: null, med: null, max: null, fotos: []}, brix: {min: null, med: null, max: null, fotos: []},
    degrana: {kg: null, fotos: []}, corpoEstranho: {presente: 'Não', descricao: '', fotos: []}, outros: '', fotosGerais: [],
    parecer: {brix: '', coloracao: '', pesoAvaliado: '', condicao: '', devolucao: ''},
    ocorrencias: [], consideracoes: '', observacoes: '', avaliador: cfg.avaliador || '', assinatura: null, criadoEm: d.toISOString() };
}
const totalAnalisado = r => (r.pesoMedio != null && r.unAnalisadas != null) ? r.pesoMedio * r.unAnalisadas : null;
const pct = (kg, r) => { const t = totalAnalisado(r); return (kg != null && t) ? kg / t * 100 : null; };
const somaDef = r => (r.defeitos || []).reduce((s, d) => s + (d.kg || 0), 0);
function condChip(r) {
  if (r.status !== 'concluida') return '<span class="chip draft">Rascunho</span>';
  const c = r.parecer?.condicao;
  if (c === 'Conforme') return '<span class="chip ok">Conforme</span>';
  if (c === 'Não conforme') return '<span class="chip bad">Não conforme</span>';
  if (c === 'Conforme com ressalva') return '<span class="chip warn">Com ressalva</span>';
  return '<span class="chip draft">Sem parecer</span>';
}
function dt(r) { const s = r.dataHora || ''; const [d, t] = s.split('T'); if (!d) return {d: '—', t: ''}; const [y, m, dd] = d.split('-'); return {d: dd + '/' + m + '/' + y, t: (t || '').slice(0, 5), y, m}; }
const quando = iso => { if (!iso) return '—'; const d = new Date(iso); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

/* ---------- Rotas ---------- */
let editing = null, filtro = {q: '', st: 'todas'}, ocupado = false;
window.addEventListener('hashchange', route);
$('#btn-new').onclick = () => { location.hash = 'nova'; };
async function route() {
  const h = location.hash.slice(1);
  $('#bar-slot').innerHTML = '';
  if (h === 'nova') { if (!editing || !editing.__new) { editing = nova(); editing.__new = true; editing.__dirty = false; } return renderForm(); }
  if (h.startsWith('editar-')) {
    const id = h.slice(7);
    if (!editing || editing.id !== id) { const r = inspecoes.find(x => x.id === id); if (!r) return (location.hash = 'lista'); editing = structuredClone(r); }
    await preUrls(editing); return renderForm();
  }
  if (editing) { await descartarEdicao(); }
  scrollTo(0, 0);
  if (h.startsWith('laudo-')) { const r = inspecoes.find(x => x.id === h.slice(6)); if (r) { await preUrls(r); return renderLaudo(r); } }
  if (h === 'compartilhar' || h === 'enviar') return renderCompartilhar();
  if (h === 'config') return renderConfig();
  renderLista();
}
async function descartarEdicao() {
  const e = editing; editing = null;
  if (e && e.status === 'rascunho' && e.__dirty) await salvar(e, false); // rascunho é salvo sempre
  await carregar(); await limparOrfas();
}

/* ---------- Instalação ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!location.hash || location.hash === '#lista') renderLista(); });
const instalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function avisoInstalar() {
  if (instalado() || cfg.ocultarInstalar) return '';
  const txt = ehIOS() ? 'Instale o app: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>. Assim as inspeções ficam guardadas com segurança no iPhone.'
    : installEvt ? 'Instale o app na tela inicial para usar sem internet e abrir mais rápido.' : 'Instale o app: no menu ⋮ do Chrome, toque em <b>Adicionar à tela inicial</b>.';
  return `<div class="notice"><p>${txt}</p>${installEvt ? '<button class="btn pri sm" type="button" id="b-install">Instalar</button>' : ''}<button class="btn ghost sm" type="button" id="b-noinst">Agora não</button></div>`;
}
function bindInstalar() {
  const b = $('#b-install'); if (b) b.onclick = async () => { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; renderLista(); };
  const n = $('#b-noinst'); if (n) n.onclick = async () => { cfg.ocultarInstalar = true; await salvarCfg(); renderLista(); };
}

/* ---------- Lista ---------- */
async function usoAparelho() { try { const e = await navigator.storage.estimate(); return e; } catch { return null; } }
async function renderLista() {
  $('#btn-new').hidden = false;
  const prontas = inspecoes.filter(pendente).length, rasc = inspecoes.filter(r => r.status !== 'concluida').length;
  $('#view').innerHTML = `${avisoInstalar()}
    <div class="head"><div><div class="eyebrow">Controle de qualidade · N.F.QUAL.001</div><h1>Inspeções de recepção</h1></div></div>
    <div class="kpis">
      <a class="kpi ${prontas ? 'go' : ''}" href="#compartilhar"><small>Para enviar</small><b>${prontas}</b></a>
      <div class="kpi"><small>Rascunhos</small><b>${rasc}</b></div>
      <div class="kpi"><small>Espaço usado no celular</small><b id="k-uso">…</b></div>
      <div class="kpi"><small>Último envio</small><b style="font-size:17px">${ultimoComp() ? quando(ultimoComp()) : '—'}</b></div>
    </div>
    <div class="filters">
      <div class="search">${ICON.search}<input id="q" type="search" placeholder="Buscar produtor, variedade, parcela ou código" value="${esc(filtro.q)}"></div>
      <div class="seg" role="group" aria-label="Filtrar">
        ${[['todas','Todas'],['concluida','Prontas'],['rascunho','Rascunhos']].map(([v,l]) => `<button type="button" data-st="${v}" aria-pressed="${filtro.st === v}">${l}</button>`).join('')}

  kv2('Peso será Avaliado', p.pesoAvaliado); kv2('Condição do recebimento', p.condicao, col(p.condicao, 'Não conforme')); kv2('Há devolução', p.devolucao, col(p.devolucao, 'Sim'));
  doc.setTextColor(...INK);
  const par = (k, txt) => { if (!txt) return; need(6); doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...INK); const wk = doc.getTextWidth(k + ': '); doc.text(k + ': ', M, y);
    doc.setFont('helvetica', 'normal'); let primeira = true;
    String(txt).split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(par1 => {
      doc.splitTextToSize(par1, primeira ? CW - wk - 1 : CW).forEach(l => { need(5); doc.text(l, primeira ? M + wk + 1 : M, y); y += primeira ? 5 : 4.5; primeira = false; }); }); };
  // Ocorrências sem repetir o que já foi escrito em Considerações finais, Outros ou nas observações
  const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').split(' ').filter(Boolean).map(w => w.length > 4 ? w.replace(/(es|s)$/, '') : w).join(' ');
  const jaDito = norm([r.consideracoes, r.outros, r.observacoes].join(' . '));
  const vistas = new Set();
  const ocs = (r.ocorrencias || []).filter(o => { const n = norm(o); if (!n || vistas.has(n) || (' ' + jaDito + ' ').includes(' ' + n + ' ')) return false; vistas.add(n); return true; });
  par('Considerações finais', r.consideracoes);
  ocs.forEach(o => { need(5); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...INK); doc.text(String(o), M, y); y += 4.5; });
  if (r.observacoes) { y += 3; doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...INK); ('Obs: ' + r.observacoes).split(/\r?\n/).filter(l => l.trim()).forEach(par1 => doc.splitTextToSize(par1, CW).forEach(l => { need(5); doc.text(l, M, y); y += 4.5; })); }
  need(36); y += 8;
  const sx = W - M - 38;
  if (r.assinatura) { const sg = await imgData(src(r.assinatura), 600); if (sg) { const h = 20, w = Math.min(60, sg.w * h / sg.h); doc.addImage(sg.data, 'JPEG', sx - w / 2, y, w, h); } }
  y += 21; doc.setDrawColor(...INK); doc.setLineWidth(.25); doc.line(sx - 38, y, sx + 38, y); y += 4;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...INK); doc.text('Assinatura do Avaliador', sx, y, {align: 'center'}); y += 3.8;
  doc.setFont('helvetica', 'normal'); doc.text(d.d, sx, y, {align: 'center'});
  if (r.avaliador) { y += 3.8; doc.text(r.avaliador, sx, y, {align: 'center'}); }
  footer();
  return doc.output('blob');
}

/* ---------- Atualizações do app ---------- */
async function iniciarAtualizacoes() {
  if (!('serviceWorker' in navigator)) return;
  let reg;
  try { reg = await navigator.serviceWorker.register('sw.js'); } catch { return; }
  const aviso = $('#upd');
  const mostrar = () => { if (reg.waiting && navigator.serviceWorker.controller) aviso.hidden = false; };
  mostrar();
  reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') mostrar(); }); });
  const checar = () => reg.update().catch(() => {});
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checar(); });
  setInterval(checar, 30 * 60 * 1000);
  let recarregando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (recarregando) return; recarregando = true; location.reload(); });
  $('#upd-btn').onclick = async () => {
    if (editing && editing.status === 'concluida' && editing.__dirty) return toast('Salve a inspeção antes de atualizar.', 3500);
    if (editing && editing.__dirty) { clearTimeout(autoT); try { await salvar(editing, false); } catch {} }
    const b = $('#upd-btn'); b.disabled = true; b.textContent = 'Atualizando…';
    if (reg.waiting) reg.waiting.postMessage('atualizar'); else location.reload();
  };
  window.__checarAtualizacao = async () => { await checar(); await new Promise(r => setTimeout(r, 1500)); mostrar(); return !!reg.waiting || !!reg.installing; };
}

  try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch {}
  await carregar(); await limparOrfas(); route();
  iniciarAtualizacoes();
})();
